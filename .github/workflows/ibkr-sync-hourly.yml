name: IBKR Hourly Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Supabase Edge Function
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.TRADE }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.IBKR_TRADE }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "${SUPABASE_URL:-}" ] || missing=1
          [ -n "${CRON_SECRET:-}" ] || missing=1
          [ -n "${SUPABASE_ANON_KEY:-}" ] || missing=1
          if [ "$missing" -eq 1 ]; then
            echo "Missing required GitHub secrets: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, CRON_SECRET"
            exit 1
          fi

          echo "Triggering hourly IBKR sync..."
          resp=$(curl -sS -w "\n%{http_code}" -X POST "${SUPABASE_URL}/functions/v1/sync-ibkr?interval=hourly" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          body=$(printf '%s' "$resp" | head -n -1)
          code=$(printf '%s' "$resp" | tail -n 1)
          echo "HTTP $code"
          echo "$body"

          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "sync-ibkr returned HTTP $code"
            exit 1
          fi

          if printf '%s' "$body" | grep -q '"ok":false'; then
            echo "One or more user syncs failed (ok:false in results)"
            exit 1
          fi

          echo "Hourly IBKR sync completed"
