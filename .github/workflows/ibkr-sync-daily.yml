name: IBKR Daily Sync

on:
  schedule:
    # UTC 05:00 ≈ 美东 01:00（夏令时）/ 00:00（冬令时）
    # IBKR statement 通常过 00:30 才可用，故凌晨 1 点再同步
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Supabase Edge Function
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.TRADE }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing secrets: need VITE_SUPABASE_URL and CRON_SECRET (must match Supabase CRON_SECRET)"
            exit 1
          fi
          echo "Triggering daily IBKR sync..."
          resp=$(curl -sS -w "\n%{http_code}" -X POST "${SUPABASE_URL}/functions/v1/sync-ibkr?interval=daily" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          body=$(echo "$resp" | head -n -1)
          code=$(echo "$resp" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::sync-ibkr failed with HTTP $code"
            exit 1
          fi
